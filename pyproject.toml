[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "json-yaml-converter"
version = "0.1.0"
description = "Convert between JSON and YAML formats from the command line"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Xu Jiaqi", email = "jiaqixu12138@gmail.com" }
]
keywords = ["json", "yaml", "converter", "cli", "devops", "config"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Text Processing :: Markup",
]
dependencies = [
    "click>=8.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
json-yaml = "json_yaml_converter.cli:main"
json2yaml = "json_yaml_converter.cli:json_to_yaml_cmd"
yaml2json = "json_yaml_converter.cli:yaml_to_json_cmd"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/Master-626/json-yaml-converter"
Repository = "https://github.com/Master-626/json-yaml-converter"
Issue-Tracker = "https://github.com/Master-626/json-yaml-converter/issues"
