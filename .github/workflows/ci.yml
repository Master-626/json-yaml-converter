name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
        include:
          # Ubuntu 26.04 has no setup-python builds for these older interpreters.
          - os: ubuntu-22.04
            python: '3.8'
          - os: ubuntu-22.04
            python: '3.9'
          - os: macos-latest
            python: '3.13'
          - os: windows-latest
            python: '3.13'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[dev]"
      - run: python -m pytest --cov=json_yaml_converter --cov-branch --cov-report=term-missing -ra
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: python -m build
      - run: json-yaml --version
      - run: json2yaml --help
      - run: yaml2json --help
